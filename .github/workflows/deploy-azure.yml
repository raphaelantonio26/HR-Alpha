name: deploy-azure
# Keyless deploy via GitHub -> Azure OIDC federation (no stored client secret).
# Build is done server-side by ACR (`az acr build`), so no Docker daemon or local
# image push is needed. The image is scanned (Trivy) and an SBOM (Syft) is
# attached before the Container App revision is rolled and the migrate Job is run.
#
# Required GitHub configuration (Settings -> Secrets and variables -> Actions):
#   Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Variables: AZURE_RESOURCE_GROUP, ACR_NAME, CONTAINER_APP, MIGRATE_JOB,
#              STATIC_WEB_APP
#   Secret (SWA deploy): AZURE_STATIC_WEB_APPS_API_TOKEN
# The federated credential subject must match this workflow's trigger
#   (e.g. repo:OWNER/REPO:ref:refs/heads/main  or  environment:production).
# NOTE: for repos created/renamed/transferred after 2026-07-15, use the
#   immutable OIDC subject format per GitHub's guidance.

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  id-token: write   # fetch the GitHub OIDC token for azure/login
  contents: read

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_REPO: hr-os-api
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR (server-side; no local Docker)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az acr build \
              --registry ${{ vars.ACR_NAME }} \
              --image ${IMAGE_REPO}:${IMAGE_TAG} \
              --image ${IMAGE_REPO}:latest \
              --file infra/Dockerfile.server .

      - name: ACR login for scanning
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: az acr login --name ${{ vars.ACR_NAME }}

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          artifact-name: hr-os-api-sbom.spdx.json

      - name: Run database migration Job (admin role bootstrap + schema)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp job start \
              --name ${{ vars.MIGRATE_JOB }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
            echo "Migration Job started; check execution history for completion."

      - name: Roll the API to the new image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ vars.CONTAINER_APP }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --image ${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_REPO}:${IMAGE_TAG}

  deploy-spa:
    runs-on: ubuntu-latest
    needs: build-scan-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci || npm install
      - name: Build SPA
        run: npm run build -w @hr-os/web
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: packages/web
          output_location: dist
          skip_app_build: true
